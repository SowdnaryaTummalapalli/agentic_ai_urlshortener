spring:
  application:
    name: url-shortener
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:mysql://localhost:3306/urlshortener
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    root: WARN
    agentic_ai.urlshortener: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

